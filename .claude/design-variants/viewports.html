<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sandbox viewports</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #9A9FA5; font: 12px system-ui, sans-serif; display: flex; gap: 16px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { margin-bottom: 6px; }
  iframe { border: 1px solid #2A2E33; background: #0A0A0A; display: block; }
</style>
</head>
<body>
<script>
  // Usage: viewports.html?v=01-nav-hero&w=390,768&h=844
  const q = new URLSearchParams(location.search);
  const v = q.get('v') || '01-nav-hero';
  const h = +(q.get('h') || 844);
  (q.get('w') || '390').split(',').forEach(w => {
    document.body.insertAdjacentHTML('beforeend',
      `<figure><figcaption>${w} × ${h}</figcaption><iframe id="f${w}" src="${v}/" width="${w}" height="${h}" title="${v} at ${w}px"></iframe></figure>`);
  });
</script>
</body>
</html>
